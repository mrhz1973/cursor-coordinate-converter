# GOI ORS gateway — nginx TLS terminator (Tailscale cert)
# Placeholders replaced at deploy: 100.99.54.93  ionos-n8n-new.tailc01234.ts.net
# Bind Tailscale IPv4 only. Not a generic proxy.

server {
    listen 100.99.54.93:443 ssl;
    server_name ionos-n8n-new.tailc01234.ts.net;
    server_tokens off;

    ssl_certificate     /etc/goi-ors/tls/fullchain.pem;
    ssl_certificate_key /etc/goi-ors/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    # Default access log: method/URI/status only. Coordinates live in POST body, not URI.
    access_log /var/log/nginx/goi-ors-gateway.access.log;
    error_log  /var/log/nginx/goi-ors-gateway.error.log warn;

    location = /ors/status {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location ~ ^/ors/v2/directions/(foot-hiking|foot-walking|cycling-mountain)/geojson$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Authorization "";
        proxy_read_timeout 25s;
        proxy_send_timeout 10s;
    }

    # NSO catalogo (added 2026-10-07) — Tailscale TLS only; upstream localhost
    location /catalogo/ {
        proxy_pass http://127.0.0.1:8089/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8089;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        client_max_body_size 20m;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /catalogo {
        return 301 /catalogo/;
    }

    location = /vps {
        return 301 /vps/;
    }

    location /vps/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found","error_category":"path"}';
    }
}

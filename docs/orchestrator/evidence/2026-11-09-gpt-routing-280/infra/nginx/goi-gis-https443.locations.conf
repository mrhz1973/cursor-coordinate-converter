# Additive server-context include. No ORS, catalogo, VPS, TLS or listen changes.
# The proxy is a loopback-only instance of the exact pinned v7 implementation.

location = /gis {
    include /etc/nginx/snippets/goi-gis-https443.common.conf;
    if ($request_uri !~ "^/gis([?].*)?$") { return 400; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_length !~ "^(0)?$") { return 400; }
    limit_except GET { deny all; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_pass http://127.0.0.1:18080/coordinate_converter%20Claude.html;
}

location = /_routing/gh/info {
    include /etc/nginx/snippets/goi-gis-https443.common.conf;
    if ($request_uri != "/_routing/gh/info") { return 400; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_length !~ "^(0)?$") { return 400; }
    limit_except GET { deny all; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_pass http://127.0.0.1:18080;
}

location = /_routing/gh/nearest {
    include /etc/nginx/snippets/goi-gis-https443.common.conf;
    if ($request_uri !~ "^/_routing/gh/nearest[?]point=[^&?]+$") { return 400; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_length !~ "^(0)?$") { return 400; }
    limit_except GET { deny all; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_pass http://127.0.0.1:18080;
}

location = /_routing/gh/route {
    include /etc/nginx/snippets/goi-gis-https443.common.conf;
    if ($request_uri != "/_routing/gh/route") { return 400; }
    if ($http_transfer_encoding != "") { return 411; }
    if ($http_content_length = "") { return 411; }
    limit_except POST { deny all; }
    proxy_set_header Content-Length $http_content_length;
    proxy_pass http://127.0.0.1:18080;
}

# Unknown GH paths must not fall through to the shared server's access log.
location = /_routing/gh {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 404 '{"error":"route_not_allowed"}';
}

location ^~ /_routing/gh/ {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 404 '{"error":"route_not_allowed"}';
}

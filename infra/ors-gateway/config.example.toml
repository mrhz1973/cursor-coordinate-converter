# GOI ORS gateway — non-secret config notes
# Secrets are NEVER stored here. Canonical secret name: ORS_API_KEY
# Path when provisioned: /etc/systemd/ors-credentials/ORS_API_KEY
# Do not put a value in this file.

[server]
host = "127.0.0.1"
port = 8020
# Runtime currently uses constants in goi_ors_gateway.py matching this template.

[secret]
name = "ORS_API_KEY"
file = "/etc/systemd/ors-credentials/ORS_API_KEY"

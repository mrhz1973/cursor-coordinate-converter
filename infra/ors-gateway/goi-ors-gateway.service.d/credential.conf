[Service]
# Canonical ORS secret injection. File on disk stays 0600 root:root.
# The unit process never opens that path; systemd copies it into $CREDENTIALS_DIRECTORY.
# Install this drop-in only when /etc/systemd/ors-credentials/ORS_API_KEY exists and is non-empty.
# If the secret file is missing, omit this drop-in so the gateway stays ready and fail-closed (503).
LoadCredential=ORS_API_KEY:/etc/systemd/ors-credentials/ORS_API_KEY
